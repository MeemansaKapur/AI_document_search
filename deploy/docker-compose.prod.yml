# Production on EC2: API behind Caddy (automatic HTTPS). Database is MongoDB Atlas (same AWS region).
#   DOMAIN=search.example.com docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  api:
    build: ..
    env_file: ../.env
    environment:
      TRUST_FORWARDED_FOR: "true"
    restart: unless-stopped
    expose: ["8000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]
volumes:
  caddy-data:
