<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Search</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#00684a; --accent-bg:#e3fcf7; --warn:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#f5f5f4; --muted:#a8a29e; --card:#1f1e1d; --line:#2e2c2a; --accent:#00ed64; --accent-bg:#0b2a1e; --warn:#fbbf24; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  form { display:grid; gap:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 100%; padding:12px 14px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  select, button { padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:14px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  @media (prefers-color-scheme: dark) { button.primary { color:#001e2b; } }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg label { padding:8px 12px; cursor:pointer; font-size:14px; }
  .seg input { display:none; }
  .seg input:checked + span { color:var(--accent); font-weight:600; }
  .answer { margin-top:24px; padding:16px; border-radius:10px; background:var(--accent-bg); white-space:pre-wrap; }
  .answer.abstain { background:transparent; border:1px dashed var(--warn); color:var(--warn); }
  .cite { color:var(--accent); font-weight:600; cursor:pointer; text-decoration:none; }
  .card { margin-top:12px; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .card.flash { outline:2px solid var(--accent); }
  .meta { color:var(--muted); font-size:13px; display:flex; gap:10px; flex-wrap:wrap; }
  .snippet { margin-top:6px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .timings { margin-top:16px; color:var(--muted); font:12px ui-monospace,Menlo,monospace; overflow-wrap:anywhere; }
  .err { color:var(--warn); margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Course Search</h1>
  <p class="sub">Hybrid keyword + vector search over course PDFs (MongoDB Atlas). Answers cite the pages they use.</p>
  <form id="f">
    <input id="q" type="text" placeholder="e.g. How does the OS decide which page to evict?" minlength="3" maxlength="500" required autofocus>
    <div class="row">
      <div class="seg" role="radiogroup" aria-label="Retrieval mode">
        <label><input type="radio" name="mode" value="keyword"><span>Keyword</span></label>
        <label><input type="radio" name="mode" value="vector"><span>Vector</span></label>
        <label><input type="radio" name="mode" value="hybrid" checked><span>Hybrid</span></label>
      </div>
      <select id="course"><option value="">All courses</option></select>
      <button type="submit">Search</button>
      <button type="button" id="ask" class="primary">Ask</button>
    </div>
  </form>
  <div id="out"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

fetch("/courses").then(r => r.ok ? r.json() : []).then(cs => {
  for (const c of cs) { const o = document.createElement("option"); o.value = o.textContent = c; $("#course").append(o); }
}).catch(() => {});

function card(p) {
  const ranks = Object.entries(p.ranks || {}).map(([k, v]) => `${k} #${v}`).join(", ");
  return `<div class="card" id="p${p.n ?? ""}">
    <div class="meta">${p.n ? `<b>[${p.n}]</b>` : ""}<b>${esc(p.title)}</b><span>${esc(p.pages)}</span>
      <span>${esc(p.course)}</span>${p.section ? `<span>§ ${esc(p.section)}</span>` : ""}<span>${esc(ranks)}</span></div>
    <div class="snippet">${esc(p.snippet)}…</div></div>`;
}
const timings = (t) => `<div class="timings">timings (ms): ${esc(JSON.stringify(t))}</div>`;

async function call(path, body) {
  $("#out").innerHTML = `<p class="sub">Searching…</p>`;
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : (data.detail?.error || JSON.stringify(data.detail) || r.statusText));
  return data;
}
const body = () => ({ q: $("#q").value.trim(), course: $("#course").value || null });

$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const mode = document.querySelector("input[name=mode]:checked").value;
    const d = await call("/search", { ...body(), mode, k: 5 });
    $("#out").innerHTML = (d.results.length ? d.results.map(card).join("") : `<p class="sub">No results.</p>`) + timings(d.timings_ms);
  } catch (err) { $("#out").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
});

$("#ask").addEventListener("click", async () => {
  if (!$("#f").reportValidity()) return;
  try {
    const d = await call("/ask", body());
    const ans = esc(d.answer).replace(/\[(\d+)\]/g, (m, n) => `<a class="cite" data-n="${n}">[${n}]</a>`);
    const shown = d.abstained ? d.citations : d.citations.filter(c => d.cited.includes(c.n));
    $("#out").innerHTML = `<div class="answer ${d.abstained ? "abstain" : ""}">${ans}</div>`
      + (d.invalid_citations?.length ? `<p class="err">Warning: answer cites missing passages ${esc(d.invalid_citations.join(", "))}</p>` : "")
      + shown.map(card).join("") + timings(d.timings_ms);
  } catch (err) { $("#out").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
});

$("#out").addEventListener("click", (e) => {
  const n = e.target.dataset?.n; if (!n) return;
  const el = document.getElementById("p" + n); if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
});
</script>
</body>
</html>
